# One command starts everything: docker compose up --build
# Game at http://localhost:8080 (web proxies /api and /ws to the api).
# The project name: containers, volumes and network are called looters-*, wherever the
# directory is.
name: looters

services:
  db:
    # Multi-architecture build of the PostGIS image (the official one is amd64 only) with
    # GEOS 3.13, needed by ST_CoverageSimplify to simplify borders without opening gaps.
    image: imresamu/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: looters
      POSTGRES_PASSWORD: looters
      POSTGRES_DB: looters
    ports: ["5433:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init/20-looters.sql:/docker-entrypoint-initdb.d/20-looters.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looters -d looters"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Single-node Kafka (KRaft): carries the battle resolution queue from api to jobs.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is used inside the compose network, HOST from the host machine (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topics are created explicitly by kafka-init, never by a typo in a service.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Creates the topics and exits. One partition is one unit of parallel battle resolution.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic "${KAFKA_BATTLE_TOPIC:-battle.resolve}"
        --partitions "${KAFKA_BATTLE_PARTITIONS:-6}" --replication-factor 1

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://looters:looters@db:5432/looters
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BATTLE_TOPIC: ${KAFKA_BATTLE_TOPIC:-battle.resolve}
      UPLOAD_DIR: /data/uploads
      PORT: "3000"
      # The browser reaches the api through the web proxy.
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
    depends_on:
      db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    volumes: [uploads:/data/uploads]
    # Only from this machine: everyone else goes through web, which sets the client address.
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  jobs:
    build: ./jobs
    environment:
      DATABASE_URL: postgresql://looters:looters@db:5432/looters
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BATTLE_TOPIC: ${KAFKA_BATTLE_TOPIC:-battle.resolve}
      UPLOAD_DIR: /data/uploads
    depends_on:
      # The api applies the migrations: jobs starts once it is up.
      api: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    volumes: [uploads:/data/uploads]

  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:8080"]

  # Backups of the database and of the uploaded geo files, in ./backups. Not part of a
  # plain `up`: `docker compose --profile backup up -d backup` takes one every
  # BACKUP_INTERVAL_HOURS; scripts/backup.sh and scripts/restore.sh use it for one-off runs.
  backup:
    profiles: [backup]
    image: imresamu/postgis:16-3.5-alpine
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: looters
      PGPASSWORD: looters
      PGDATABASE: looters
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads
      - ./db/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/usr/local/bin/backup.sh"]
    command: ["loop"]

volumes:
  dbdata:
  kafkadata:
  uploads:
